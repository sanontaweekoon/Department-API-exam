events {}

http {
    log_format upstream_log '$time_iso8601 status=$status method=$request_method path=$request_uri '
                            'upstream=$upstream_addr upstream_status=$upstream_status '
                            'request_time=$request_time upstream_time=$upstream_response_time '
                            'request_id=$http_x_request_id';

    access_log /var/log/nginx/lb_access.log upstream_log;
    error_log  /var/log/nginx/lb_error.log warn;

    upstream spring_backend {
        server app1:8200 max_fails=3;
        server app2:8200 max_fails=3;
    }

    server {
        listen 80;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://spring_backend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}