x-app: &app
  # build: .
  # Classroom workload: ceiling per replica, not preallocated resources.
  cpus: 1.0
  mem_limit: 768m
  memswap_limit: 1536m
  stop_grace_period: 40s
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  healthcheck:
    test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8200/actuator/health/readiness']
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 90s
  networks: [backend, monitoring]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

x-app-env: &app-env
  DB_URL: jdbc:postgresql://postgres:5432/examdb
  DB_USERNAME: exam_user
  DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  APP_ENVIRONMENT: ${APP_ENVIRONMENT:-local}
  LOGGING_FILE_NAME: /var/log/spring/application.log

services:
  postgres:
    container_name: postgres-db
    image: postgres:17-alpine
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 1024m
    environment:
      POSTGRES_DB: examdb
      POSTGRES_USER: exam_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U exam_user -d examdb']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [backend]
    ports: ['127.0.0.1:${POSTGRES_PORT:-5432}:5432']

  app1:
    <<: *app
    build: .
    environment:
      <<: *app-env
      APPLICATION_NAME: app1
      INSTANCE_NAME: app-1
    volumes:
      - app1_logs:/var/log/spring
    container_name: spring-app-1
    image: department-api:0.0.1

  app2:
    <<: *app
    environment:
      <<: *app-env
      APPLICATION_NAME: app2
      INSTANCE_NAME: app-2
    volumes:
      - app2_logs:/var/log/spring
    container_name: spring-app-2
    image: department-api:0.0.1

  nginx:
    container_name: nginx-lb
    image: nginx:1.31.6-alpine
    cpus: 0.25
    mem_limit: 64m
    memswap_limit: 128m
    ports: ['5200:80']
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1/nginx-health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks: [backend]

  prometheus:
    image: prom/prometheus:v3.5.0
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 1024m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --storage.tsdb.retention.size=5GB
    configs:
      - source: prometheus-targets
        target: /etc/prometheus/targets.json
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:9090/-/ready']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks: [monitoring, grafana-access]
    ports: ['127.0.0.1:${PROMETHEUS_PORT:-9090}:9090']

  loki:
    image: grafana/loki:3.5.3
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 1024m
    command: [-config.file=/etc/loki/config.yml, -config.expand-env=true]
    environment:
      LOKI_RETENTION: ${LOKI_RETENTION:-168h}
    volumes:
      - ./monitoring/loki.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:3100/ready']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks: [monitoring]

  alloy:
    image: grafana/alloy:v1.10.2
    cpus: 0.25
    mem_limit: 256m
    memswap_limit: 512m
    command: [run, --server.http.listen-addr=0.0.0.0:12345, --storage.path=/var/lib/alloy/data, /etc/alloy/config.alloy]
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-local}
    volumes:
      - ./monitoring/config.alloy:/etc/alloy/config.alloy:ro
      - nginx_logs:/logs/nginx:ro
      - app1_logs:/logs/app1:ro
      - app2_logs:/logs/app2:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: [CMD, bash, -ec, 'exec 3<>/dev/tcp/127.0.0.1/12345; printf "GET /-/ready HTTP/1.0\r\n\r\n" >&3; head -1 <&3 | grep -q "200"']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks: [monitoring]

  grafana:
    image: grafana/grafana:12.1.1
    cpus: 0.5
    mem_limit: 384m
    memswap_limit: 768m
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    ports: ['127.0.0.1:${GRAFANA_PORT:-3000}:3000']
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks: [monitoring, grafana-access]

volumes:
  postgres_data:
  app1_logs:
  app2_logs:
  nginx_logs:
  prometheus_data:
  loki_data:
  alloy_data:
  grafana_data:

networks:
  backend:
    driver: bridge
  monitoring:
    internal: true
  grafana-access:
    driver: bridge

configs:
  prometheus-targets:
    content: |
      [
        {"targets":["app1:8200"],"labels":{"job":"app1","application":"app1","instance":"app-1","environment":"${APP_ENVIRONMENT:-local}"}},
        {"targets":["app2:8200"],"labels":{"job":"app2","application":"app2","instance":"app-2","environment":"${APP_ENVIRONMENT:-local}"}}
      ]
